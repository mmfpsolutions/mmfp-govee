{{define "mappings-content"}}
<div id="mappings-page">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">Event Mappings</h1>
            <p class="text-sm mt-1" style="color: #94a3b8;">Route GSS / GSSM webhook events to Govee light effects</p>
        </div>
        <button onclick="openMappingModal(null)"
                class="px-4 py-2 rounded text-sm font-medium transition-colors"
                style="background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; cursor: pointer;">
            + New Mapping
        </button>
    </div>

    <!-- Loading -->
    <div id="mappings-loading" class="text-center py-12">
        <div class="spinner mx-auto mb-4"></div>
        <p style="color: #94a3b8;">Loading mappings...</p>
    </div>

    <div id="mappings-list" class="hidden max-w-4xl space-y-3"></div>

    <div id="mappings-empty" class="hidden max-w-4xl text-center py-12 device-card">
        <p style="color: #94a3b8;">No mappings yet. Create one to light up on your first block.</p>
    </div>

    <!-- Mapping Editor Modal -->
    <div id="mapping-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-lg shadow-xl max-w-2xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto" style="border: 1px solid rgba(51, 65, 85, 0.5);">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white" id="mapping-modal-title">New Mapping</h3>
                <button onclick="closeMappingModal()" class="text-slate-400 hover:text-white transition-colors text-xl">&times;</button>
            </div>

            <div id="mapping-modal-error" class="hidden mb-4 p-3 rounded-lg text-sm"
                 style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;"></div>

            <form id="mapping-form" onsubmit="return false;">
                <!-- Name -->
                <div class="mb-4">
                    <label class="block text-sm mb-1.5" style="color: #94a3b8;">Name</label>
                    <input type="text" id="mapping-name" class="settings-input w-full" placeholder="Block found — celebrate">
                </div>

                <!-- Token + Cooldown -->
                <div class="flex flex-wrap gap-4 mb-4">
                    <div>
                        <label class="block text-sm mb-1.5" style="color: #94a3b8;">Token</label>
                        <select id="mapping-token" class="settings-select"></select>
                    </div>
                    <div>
                        <label class="block text-sm mb-1.5" style="color: #94a3b8;">Cooldown (seconds)</label>
                        <input type="number" id="mapping-cooldown" class="settings-input w-24" min="0" max="3600" value="10">
                    </div>
                    <div>
                        <label class="block text-sm mb-1.5" style="color: #94a3b8;">Enabled</label>
                        <input type="checkbox" id="mapping-enabled" class="settings-checkbox" checked>
                    </div>
                </div>

                <!-- Events -->
                <div class="mb-4">
                    <label class="block text-sm mb-1.5" style="color: #94a3b8;">Events</label>
                    <div id="mapping-events" class="rounded-lg p-3 max-h-48 overflow-y-auto" style="background-color: #0f172a; border: 1px solid #475569;"></div>
                    <div class="flex items-center gap-2 mt-2">
                        <input type="text" id="mapping-event-custom" class="settings-input w-64" placeholder="custom_event_type">
                        <button onclick="addCustomEvent()" class="px-3 py-1.5 rounded text-sm"
                                style="background: rgba(51, 65, 85, 0.5); color: #e2e8f0; border: 1px solid rgba(71, 85, 105, 0.5); cursor: pointer;">Add</button>
                    </div>
                </div>

                <!-- Entity filter -->
                <div class="mb-4">
                    <label class="block text-sm mb-1.5" style="color: #94a3b8;">Entity filter <span style="color: #64748b;">(optional — GSSM miner/pool/node name contains)</span></label>
                    <input type="text" id="mapping-entity" class="settings-input w-64" placeholder="Bitaxe Garage">
                </div>

                <!-- Devices -->
                <div class="mb-4">
                    <label class="block text-sm mb-1.5" style="color: #94a3b8;">Devices</label>
                    <div id="mapping-devices" class="rounded-lg p-3 max-h-48 overflow-y-auto" style="background-color: #0f172a; border: 1px solid #475569;"></div>
                </div>

                <!-- Effect + preset -->
                <div class="flex flex-wrap gap-4 mb-4">
                    <div>
                        <label class="block text-sm mb-1.5" style="color: #94a3b8;">Preset</label>
                        <select id="mapping-preset" class="settings-select" onchange="applyPreset()">
                            <option value="">Custom...</option>
                            <option value="celebrate">Celebrate (green/gold ×5)</option>
                            <option value="alert">Alert (red ×5)</option>
                            <option value="allclear">All clear (solid green)</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-1.5" style="color: #94a3b8;">Effect</label>
                        <select id="mapping-effect" class="settings-select" onchange="renderEffectParams()">
                            <option value="flash">flash</option>
                            <option value="solid">solid</option>
                            <option value="on">on</option>
                            <option value="off">off</option>
                        </select>
                    </div>
                </div>

                <!-- Effect params -->
                <div id="mapping-params" class="flex flex-wrap items-end gap-4 mb-6"></div>

                <div class="flex justify-end space-x-3">
                    <button onclick="closeMappingModal()"
                            class="px-4 py-2 rounded text-sm font-medium transition-colors"
                            style="background: rgba(51, 65, 85, 0.5); color: #e2e8f0; border: 1px solid rgba(71, 85, 105, 0.5); cursor: pointer;">
                        Cancel
                    </button>
                    <button onclick="saveMapping()" id="mapping-save-btn"
                            class="px-4 py-2 rounded text-sm font-medium transition-colors"
                            style="background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; cursor: pointer;">
                        Save Mapping
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="mapping-confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-lg shadow-xl max-w-md w-full mx-4 p-6" style="border: 1px solid rgba(51, 65, 85, 0.5);">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white" id="mapping-confirm-modal-title">Confirm</h3>
                <button onclick="closeMappingConfirmModal()" class="text-slate-400 hover:text-white transition-colors text-xl">&times;</button>
            </div>
            <div id="mapping-confirm-modal-content"></div>
        </div>
    </div>
</div>
{{end}}
