{{define "header"}}
<header class="shadow-md" style="background: rgba(30, 41, 59, 0.6); border-bottom: 1px solid rgba(51, 65, 85, 0.5);">
    <nav class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo and Title -->
            <div class="flex items-center space-x-3">
                <a href="/" id="header-title" class="header-title hover:opacity-80 transition-opacity">{{.Title}}</a>
            </div>

            <!-- Navigation Tabs (Desktop) -->
            <div id="nav-tabs" class="hidden md:flex items-center space-x-1 bg-slate-800/50 rounded-lg p-1">
                <a href="/devices"
                   class="nav-tab {{if eq .ActivePage "devices"}}active{{end}}"
                   data-page="devices">
                    <span class="tab-label">Devices</span>
                    <span class="tab-count" id="devices-count"></span>
                </a>
                <a href="/mappings"
                   class="nav-tab {{if eq .ActivePage "mappings"}}active{{end}}"
                   data-page="mappings">
                    <span class="tab-label">Mappings</span>
                    <span class="tab-count" id="mappings-count"></span>
                </a>
                <a href="/tokens"
                   class="nav-tab {{if eq .ActivePage "tokens"}}active{{end}}"
                   data-page="tokens">
                    <span class="tab-label">Tokens</span>
                    <span class="tab-count" id="tokens-count"></span>
                </a>
                <a href="/activity"
                   class="nav-tab {{if eq .ActivePage "activity"}}active{{end}}"
                   data-page="activity">
                    <span class="tab-label">Activity</span>
                </a>
            </div>

            <!-- Right-side controls -->
            <div class="flex items-center space-x-3">
                <div class="flex items-center">
                    <button onclick="window.location.reload()" title="Refresh"
                            class="flex items-center px-2 py-2 rounded hover:bg-slate-700/50 transition-colors"
                            style="background: none; border: none; cursor: pointer;">
                        <svg class="w-5 h-5 text-slate-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                    <a href="/settings" id="settings-link" class="flex items-center px-2 py-2 rounded hover:bg-slate-700/50 transition-colors" title="Settings">
                        <svg class="w-5 h-5 text-slate-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </a>
                </div>

                {{if .Username}}
                <div class="flex items-center space-x-2" style="padding: 4px 10px; border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 4px;">
                    <span class="text-sm" style="color: #e2e8f0;">{{.Username}}</span>
                    <button onclick="handleLogout()" class="text-xs px-2 py-0.5 rounded transition-colors"
                            style="color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); cursor: pointer;">
                        Logout
                    </button>
                </div>
                {{end}}
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="md:hidden mt-4" id="mobile-nav">
            <select id="mobile-page-selector" class="coin-selector-mobile" onchange="window.location.href=this.value">
                <option value="/devices" {{if eq .ActivePage "devices"}}selected{{end}}>Devices</option>
                <option value="/mappings" {{if eq .ActivePage "mappings"}}selected{{end}}>Mappings</option>
                <option value="/tokens" {{if eq .ActivePage "tokens"}}selected{{end}}>Tokens</option>
                <option value="/activity" {{if eq .ActivePage "activity"}}selected{{end}}>Activity</option>
                <option value="/settings" {{if eq .ActivePage "settings"}}selected{{end}}>Settings</option>
            </select>
        </div>
    </nav>
</header>
{{end}}
