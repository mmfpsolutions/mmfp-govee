{{define "devices-content"}}
<div id="devices-page">
    <!-- Loading State -->
    <div id="devices-loading" class="text-center py-12">
        <div class="spinner mx-auto mb-4"></div>
        <p style="color: #94a3b8;">Loading Govee devices...</p>
    </div>

    <!-- Error State -->
    <div id="devices-error" class="hidden max-w-2xl mx-auto mb-6 p-4 rounded-lg text-sm"
         style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;">
    </div>

    <!-- Content (width-capped: four compact columns don't need the full container) -->
    <div id="devices-content-inner" class="hidden max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white">Govee Devices</h1>
                <p class="text-sm mt-1" style="color: #94a3b8;">
                    <span id="devices-cached-at"></span>
                    <!-- Re-fetching only matters when the ENVIRONMENT changed (a new
                         device, a changed IP), so it lives as an icon beside the
                         timestamp it updates rather than as a full-width button. -->
                    <button id="devices-refresh-btn" onclick="refreshDevices()"
                            class="icon-refresh" title="Fetch from Govee" aria-label="Fetch from Govee">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M4 4v5h5M20 20v-5h-5M20 9a8 8 0 0 0-14.3-3.4L4 9m16 6-1.7 3.4A8 8 0 0 1 4 15"/>
                        </svg>
                    </button>
                </p>
            </div>
            <!-- Read-only sensor readout. These devices have no control row
                 (nothing on them can be commanded), so this is the only place
                 their reading surfaces. Hidden until a value arrives. -->
            <div id="devices-sensors" class="items-center gap-3" style="display: none;"></div>
        </div>

        <div class="list-header list-cols-devices">
            <div>Status</div>
            <div>Device Name</div>
            <div class="devices-col-model">Model</div>
            <div class="devices-col-id">Device ID</div>
            <div>LAN Control</div>
        </div>
        <div id="devices-list" class="space-y-1"></div>

        <div id="devices-empty" class="hidden text-center py-12">
            <p style="color: #94a3b8;">No devices found for this Govee account.</p>
        </div>
    </div>
</div>
{{end}}
