{{define "login-content"}}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">&#128161;</div>
            <h1 class="text-2xl font-bold text-white">{{.Title}}</h1>
            <p class="text-sm mt-1" style="color: #94a3b8;">Sign in to your dashboard</p>
        </div>

        <!-- Login Card -->
        <div class="rounded-lg p-6" style="background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(51, 65, 85, 0.5);">
            <form id="login-form" onsubmit="return false;">
                <!-- Error Message -->
                <div id="login-error" class="hidden mb-4 p-3 rounded-lg text-sm"
                     style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;">
                </div>

                <!-- Username -->
                <div class="mb-4">
                    <label for="login-username" class="block text-sm mb-1.5" style="color: #94a3b8;">Username</label>
                    <input type="text" id="login-username" autocomplete="username" autofocus
                           class="w-full px-3 py-2.5 rounded-lg text-sm border focus:outline-none focus:ring-2"
                           style="background-color: #0f172a; border-color: #475569; color: #f1f5f9;"
                           placeholder="Enter username">
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="login-password" class="block text-sm mb-1.5" style="color: #94a3b8;">Password</label>
                    <input type="password" id="login-password" autocomplete="current-password"
                           class="w-full px-3 py-2.5 rounded-lg text-sm border focus:outline-none focus:ring-2"
                           style="background-color: #0f172a; border-color: #475569; color: #f1f5f9;"
                           placeholder="Enter password">
                </div>

                <!-- Login Button -->
                <button id="login-btn" type="submit"
                        class="w-full py-2.5 rounded-lg text-sm font-medium transition-colors"
                        style="background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; cursor: pointer;">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-xs mt-6" style="color: #475569;">&copy; 2026 MMFP Solutions</p>
    </div>
</div>
{{end}}
